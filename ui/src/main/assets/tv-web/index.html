<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>WireGuard TV Config Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
      --accent: #111827;
      --accent-strong: #000000;
      --accent-soft: #eef2ff;
      --accent-soft-text: #3730a3;
      --danger: #d97706;
      --danger-strong: #b45309;
      --success: #166534;
      --success-soft: #dcfce7;
      --border: #e5e7eb;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font:
        14px/1.5 Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }
    .title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .subtitle {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    p { color: var(--muted); margin: 0 0 12px; }
    .warning {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      margin: 0 0 18px;
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid #f59e0b;
      border-radius: 8px;
      color: #374151;
    }
    .warning::before {
      content: "Note";
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #b45309;
    }
    .grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    label {
      display: block;
      color: var(--muted);
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input, textarea, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
    }
    input { padding: 11px 12px; }
    input[disabled] { color: var(--muted); background: var(--panel-soft); }
    input:focus,
    textarea:focus,
    button:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    textarea {
      min-height: 70vh;
      resize: vertical;
      padding: 14px;
      white-space: pre;
      overflow: auto;
      line-height: 1.6;
      tab-size: 2;
    }
    button {
      cursor: pointer;
      height: 38px;
      padding: 0 14px;
      margin-top: 10px;
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 500;
    }
    button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    button.secondary {
      background: #ffffff;
      border-color: var(--border);
      color: var(--text);
    }
    button.secondary:hover { background: #f3f4f6; }
    button.danger {
      background: #ffffff;
      border-color: #fed7aa;
      color: var(--danger-strong);
    }
    button.danger:hover { background: #fff7ed; }
    button:disabled { cursor: not-allowed; opacity: 0.56; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .toolbar button { margin-top: 0; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li button {
      margin: 0 0 8px;
      text-align: left;
      background: transparent;
      border-color: transparent;
      color: var(--text);
      box-shadow: none;
    }
    li button:hover { background: #f3f4f6; }
    li button.active {
      background: var(--accent-soft);
      color: var(--accent-soft-text);
      border-color: transparent;
      box-shadow: none;
    }
    .state {
      float: right;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
    }
    .state.up {
      background: var(--success-soft);
      color: var(--success);
    }
    .state.down {
      background: #f3f4f6;
      color: #4b5563;
    }
    .hidden { display: none; }
    .error { color: var(--danger-strong); min-height: 1.5em; margin-top: 10px; }
    .ok { color: var(--success); min-height: 1.5em; margin-top: 10px; }
    .keypair {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: var(--muted);
      overflow-wrap: anywhere;
      margin-top: 10px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
    }
    textarea,
    .keypair {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
    }
    aside.panel {
      position: sticky;
      top: 24px;
    }
    .qr-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 24, 39, 0.8);
    }
    .qr-modal.hidden { display: none; }
    .qr-dialog {
      width: min(720px, 100%);
      max-height: 100%;
      overflow: auto;
    }
    .qr-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .qr-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
    }
    .qr-video-shell {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #020617;
      aspect-ratio: 4 / 3;
      margin-bottom: 12px;
    }
    .qr-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .qr-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .qr-note {
      color: var(--muted);
      margin-top: 10px;
    }
    @media (max-width: 820px) {
      main { padding: 16px; }
      header { display: block; }
      .title { align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      textarea { min-height: 48vh; }
      aside.panel { position: static; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="title">
      <h1>WireGuard TV</h1>
      <span class="subtitle">Tunnel Manager</span>
    </div>
    <p>Temporary LAN access for adding and editing tunnels on this TV device.</p>
  </header>
  <div class="warning">Private keys are visible and editable here. Use only on a trusted LAN and stop the server from the TV when finished.</div>

  <section id="login" class="panel">
    <label for="pin">PIN shown on TV</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="00000000">
    <button id="loginButton">Unlock</button>
    <div id="loginError" class="error"></div>
  </section>

  <section id="editor" class="grid hidden">
    <aside class="panel">
      <div class="toolbar">
        <button id="newButton">New tunnel</button>
        <button id="scanQrButton" class="secondary">Scan QR</button>
      </div>
      <ul id="tunnels"></ul>
      <div id="listError" class="error"></div>
    </aside>

    <section class="panel">
      <label for="tunnelName">Tunnel name</label>
      <input id="tunnelName" placeholder="my-tunnel">

      <label for="configText" style="margin-top:14px">wg-quick config</label>
      <textarea id="configText" spellcheck="false" placeholder="[Interface]
PrivateKey = ...
Address = ...

[Peer]
PublicKey = ...
AllowedIPs = ...
Endpoint = ..."></textarea>

      <div class="row">
        <button id="saveButton">Save</button>
        <button id="deleteButton" class="danger">Delete</button>
      </div>
      <button id="keypairButton" class="secondary">Generate keypair</button>
      <div id="keypair" class="keypair hidden"></div>
      <div id="status" class="ok"></div>
      <div id="configError" class="error"></div>
    </section>
  </section>
</main>
<div id="qrModal" class="qr-modal hidden" aria-hidden="true">
  <section class="panel qr-dialog" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="qr-header">
      <div>
        <h2 id="qrTitle">Scan WireGuard QR</h2>
        <p>Decoded text will be loaded as a new tunnel draft.</p>
      </div>
      <button id="closeQrButton" class="secondary" type="button">Close</button>
    </div>
    <div class="qr-video-shell">
      <video id="qrVideo" class="qr-video" playsinline muted></video>
      <div id="qrOverlay" class="qr-overlay"></div>
    </div>
    <button id="scanQrImageButton" class="secondary" type="button">Scan QR image</button>
    <input id="scanQrImageInput" class="hidden" type="file" accept="image/*" capture="environment">
    <div id="qrError" class="error"></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js"></script>
<script>
(() => {
  let token = '';
  let selectedName = '';
  let selectedState = 'DOWN';
  let creating = true;
  let qrScanner = null;
  let qrScanComplete = false;
  const login = document.getElementById('login');
  const editor = document.getElementById('editor');
  const pin = document.getElementById('pin');
  const loginError = document.getElementById('loginError');
  const listError = document.getElementById('listError');
  const configError = document.getElementById('configError');
  const status = document.getElementById('status');
  const tunnels = document.getElementById('tunnels');
  const tunnelName = document.getElementById('tunnelName');
  const configText = document.getElementById('configText');
  const deleteButton = document.getElementById('deleteButton');
  const keypairBox = document.getElementById('keypair');
  const scanQrButton = document.getElementById('scanQrButton');
  const qrModal = document.getElementById('qrModal');
  const qrVideo = document.getElementById('qrVideo');
  const qrOverlay = document.getElementById('qrOverlay');
  const qrError = document.getElementById('qrError');
  const closeQrButton = document.getElementById('closeQrButton');
  const scanQrImageButton = document.getElementById('scanQrImageButton');
  const scanQrImageInput = document.getElementById('scanQrImageInput');

  async function api(path, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    if (token) headers.Authorization = `Bearer ${token}`;
    const response = await fetch(path, Object.assign({}, options, { headers }));
    if (!response.ok) {
      let message = `${response.status} ${response.statusText}`;
      try { message = (await response.json()).error || message; } catch (_) {}
      throw new Error(message);
    }
    return response;
  }

  function clearMessages() {
    configError.textContent = '';
    status.textContent = '';
  }

  function clearQrMessage() {
    qrError.textContent = '';
  }

  function setCreating() {
    creating = true;
    selectedName = '';
    selectedState = 'DOWN';
    tunnelName.disabled = false;
    tunnelName.value = '';
    configText.value = '';
    deleteButton.disabled = true;
    keypairBox.classList.add('hidden');
    keypairBox.textContent = '';
    clearMessages();
    loadTunnels();
  }

  function getQrScannerLib() {
    if (!window.QrScanner) {
      throw new Error('QR scanner library did not load.');
    }
    return window.QrScanner;
  }

  function decodedQrData(result) {
    return result && typeof result === 'object' ? result.data : result;
  }

  function applyDecodedQrText(decodedText, source) {
    const text = String(decodedText || '').trim();
    if (!text) {
      throw new Error('Decoded QR code was empty.');
    }
    setCreating();
    configText.value = text;
    configText.focus();
    configText.setSelectionRange(0, 0);
    status.textContent = source === 'camera'
      ? 'Scanned QR config into a new tunnel draft. Enter a tunnel name and save.'
      : 'Loaded QR image into a new tunnel draft. Enter a tunnel name and save.';
  }

  function destroyQrScanner() {
    if (!qrScanner) return;
    qrScanner.destroy();
    qrScanner = null;
    qrOverlay.innerHTML = '';
  }

  function closeQrModal() {
    destroyQrScanner();
    qrModal.classList.add('hidden');
    qrModal.setAttribute('aria-hidden', 'true');
    clearQrMessage();
  }

  async function startQrScanner() {
    clearMessages();
    clearQrMessage();
    qrScanComplete = false;
    qrModal.classList.remove('hidden');
    qrModal.setAttribute('aria-hidden', 'false');
    try {
      const QrScanner = getQrScannerLib();
      if (!window.isSecureContext) {
        throw new Error('Camera scanning is blocked on this HTTP page. Use Scan QR image instead.');
      }
      qrScanner = new QrScanner(
        qrVideo,
        result => {
          if (qrScanComplete) return;
          qrScanComplete = true;
          applyDecodedQrText(decodedQrData(result), 'camera');
          closeQrModal();
        },
        {
          preferredCamera: 'environment',
          highlightScanRegion: true,
          highlightCodeOutline: true,
          overlay: qrOverlay,
          returnDetailedScanResult: true,
          onDecodeError: () => {}
        }
      );
      await qrScanner.start();
      qrError.textContent = 'Point the camera at a WireGuard config QR code.';
    } catch (error) {
      destroyQrScanner();
      qrError.textContent = error.message || 'Unable to start the QR camera scanner.';
    }
  }

  function requestQrImageScan() {
    clearMessages();
    clearQrMessage();
    scanQrImageInput.value = '';
    scanQrImageInput.click();
  }

  async function onQrImageSelected(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const QrScanner = getQrScannerLib();
      const result = await QrScanner.scanImage(file, { returnDetailedScanResult: true });
      applyDecodedQrText(decodedQrData(result), 'image');
      closeQrModal();
    } catch (error) {
      qrError.textContent = error.message || 'Unable to read a QR code from that image.';
    }
  }

  async function unlock() {
    loginError.textContent = '';
    try {
      const response = await api('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin.value.trim() })
      });
      token = (await response.json()).token;
      login.classList.add('hidden');
      editor.classList.remove('hidden');
      setCreating();
    } catch (error) {
      loginError.textContent = error.message;
    }
  }

  async function loadTunnels() {
    listError.textContent = '';
    tunnels.innerHTML = '';
    try {
      const response = await api('/api/tunnels');
      const items = await response.json();
      for (const tunnel of items) {
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.textContent = tunnel.name;
        const state = document.createElement('span');
        state.className = `state ${String(tunnel.state || '').toLowerCase()}`;
        state.textContent = tunnel.state;
        button.appendChild(state);
        button.className = tunnel.name === selectedName ? 'active' : '';
        button.onclick = () => loadConfig(tunnel.name, tunnel.state);
        li.appendChild(button);
        tunnels.appendChild(li);
      }
    } catch (error) {
      listError.textContent = error.message;
    }
  }

  async function loadConfig(name, state) {
    clearMessages();
    creating = false;
    selectedName = name;
    selectedState = state;
    tunnelName.disabled = true;
    tunnelName.value = name;
    deleteButton.disabled = false;
    keypairBox.classList.add('hidden');
    keypairBox.textContent = '';
    try {
      const response = await api(`/api/tunnels/${encodeURIComponent(name)}`);
      configText.value = await response.text();
      if (state === 'UP') {
        status.textContent = 'This tunnel is running. Save and delete will be rejected until it is stopped.';
      }
      await loadTunnels();
    } catch (error) {
      configError.textContent = error.message;
    }
  }

  async function saveTunnel() {
    clearMessages();
    const name = tunnelName.value.trim();
    const body = JSON.stringify({ name, configText: configText.value });
    try {
      if (creating) {
        await api('/api/tunnels', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        status.textContent = `Created ${name}`;
        await loadConfig(name, 'DOWN');
      } else {
        await api(`/api/tunnels/${encodeURIComponent(selectedName)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
        status.textContent = `Saved ${selectedName}`;
        await loadTunnels();
      }
    } catch (error) {
      configError.textContent = error.message;
    }
  }

  async function deleteTunnel() {
    clearMessages();
    if (creating || !selectedName) return;
    if (!confirm(`Delete tunnel "${selectedName}"?`)) return;
    try {
      await api(`/api/tunnels/${encodeURIComponent(selectedName)}`, { method: 'DELETE' });
      status.textContent = `Deleted ${selectedName}`;
      setCreating();
    } catch (error) {
      configError.textContent = error.message;
    }
  }

  function insertPrivateKey(privateKey) {
    const text = configText.value;
    if (/^\s*PrivateKey\s*=.*$/mi.test(text)) {
      configText.value = text.replace(/^\s*PrivateKey\s*=.*$/mi, `PrivateKey = ${privateKey}`);
    } else if (/^\s*\[Interface\]\s*$/mi.test(text)) {
      configText.value = text.replace(/^\s*\[Interface\]\s*$/mi, `[Interface]\nPrivateKey = ${privateKey}`);
    } else {
      configText.value = `[Interface]\nPrivateKey = ${privateKey}\nAddress = \n\n[Peer]\nPublicKey = \nAllowedIPs = \nEndpoint = \n`;
    }
  }

  async function generateKeypair() {
    clearMessages();
    try {
      const response = await api('/api/keypair');
      const keys = await response.json();
      insertPrivateKey(keys.privateKey);
      keypairBox.textContent = `PrivateKey: ${keys.privateKey}\nPublicKey: ${keys.publicKey}`;
      keypairBox.classList.remove('hidden');
      status.textContent = 'Generated keypair and inserted the private key into the config.';
    } catch (error) {
      configError.textContent = error.message;
    }
  }

  document.getElementById('loginButton').onclick = unlock;
  document.getElementById('newButton').onclick = setCreating;
  document.getElementById('saveButton').onclick = saveTunnel;
  document.getElementById('deleteButton').onclick = deleteTunnel;
  document.getElementById('keypairButton').onclick = generateKeypair;
  scanQrButton.onclick = startQrScanner;
  closeQrButton.onclick = closeQrModal;
  scanQrImageButton.onclick = requestQrImageScan;
  scanQrImageInput.addEventListener('change', onQrImageSelected);
  pin.addEventListener('keydown', event => { if (event.key === 'Enter') unlock(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !qrModal.classList.contains('hidden')) {
      closeQrModal();
    }
  });
  pin.focus();
})();
</script>
</body>
</html>
